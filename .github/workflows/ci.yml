name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Git konfigurieren (für die Test-Fixtures)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "AETHEL CI"
          git config --global init.defaultBranch main

      - name: Tests
        run: PYTHONPATH=src python3 -m pytest tests/ -v

      - name: Artefakt-Abdeckung
        run: PYTHONPATH=src python3 -m pytest tests/test_coverage.py -v
