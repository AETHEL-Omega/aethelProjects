publish_to: 'none'
version: 0.3.2+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
